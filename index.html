<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="社内ボード">
<!-- 外部への通信を一切禁止（データはこのiPadのlocalStorageにだけ保存） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>社内掲示ボード</title>
<style>
:root{
  --navy:#1d4b7c; --navy2:#2d6197; --cell:#e8edf3; --name:#f3f5f7; --line:#c5cfda;
  --ink:#161b22; --sub:#5b6673; --red:#c0181f; --gray:#b9c1cb; --label:#cfe0f5; --blue:#1f5fbf;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:#000;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}

/* ===== 表示モード ===== */
#stage{position:fixed;inset:0;background:#000;overflow:hidden}
body.editing #stage{display:none}
#board{position:absolute;left:50%;top:50%;width:1080px;height:1440px;background:#fff;overflow:hidden;transform-origin:center center}
.screen{position:absolute;left:0;right:0;top:0;bottom:68px;display:none;flex-direction:column;padding:26px 30px 10px}
.screen.on{display:flex}
.hd{display:flex;align-items:center;height:136px;flex:0 0 auto;border-bottom:4px solid var(--navy);margin-bottom:14px}
.hd .date{font-size:84px;font-weight:800;letter-spacing:-2px;white-space:nowrap;line-height:1}
.hd .date small{font-size:46px;font-weight:700;margin:0 2px}
.hd .title{flex:1;text-align:center;font-size:74px;font-weight:800;letter-spacing:10px;border-left:2px solid var(--line);margin-left:24px;white-space:nowrap}
.hd .dow{display:flex;align-items:center;gap:8px;font-size:40px;font-weight:700;white-space:nowrap}
.hd .dow b{background:var(--navy);color:#fff;font-size:62px;width:92px;height:92px;display:grid;place-items:center;border-radius:6px}
.hd .dow b.sat{background:var(--blue)} .hd .dow b.sun{background:var(--red)}
.fit{white-space:nowrap;overflow:hidden}
.hd .title.wb{font-size:62px;letter-spacing:8px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.hd .badge{font-size:28px;letter-spacing:2px;background:#f0b429;color:#222;border-radius:22px;padding:3px 22px;margin-top:6px}
.hd.next{border-bottom-color:#f0b429}
.hd.next .date{color:#9a5b00}

/* 行動予定表 */
.sch{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.sch .r{display:grid;grid-template-columns:230px 1fr 230px;gap:8px;flex:1 1 0;min-height:0}
.sch .r.th{flex:0 0 62px}
.sch .r.th div{background:var(--navy);color:#fff;font-weight:700;display:grid;place-items:center;font-size:34px;letter-spacing:8px}
.sch .c{display:flex;align-items:center;border-radius:4px;font-weight:700}
.sch .nm{justify-content:center;background:var(--name);border:2px solid var(--line);font-weight:800;letter-spacing:4px}
.sch .ds{background:var(--cell);border:1px solid var(--line);padding:0 24px}
.sch .ds .until{color:var(--sub);margin-left:.8em;font-weight:600}
.sch .ds .red{color:var(--red)}
.sch .bk{background:var(--gray);justify-content:center}
.sch .grp .nm{background:var(--label);border-color:#b4cbe6;color:var(--navy);letter-spacing:2px;font-size:.72em}
.sch .grp .ds,.sch .grp .bk{background:transparent;border:none}
.sch .sep{border-top:2px solid #9aa7b5;margin:2px 0}
.sch .note{flex:0 0 96px;display:grid;grid-template-columns:230px 1fr;gap:8px;margin-top:6px}
.sch .note .nm{background:var(--label);border-color:#b4cbe6;color:var(--navy);font-size:30px;letter-spacing:4px}
.sch .note .ds{background:#fff;border:2px solid var(--line);font-size:32px;white-space:normal;line-height:1.25}

/* 売上推移表 */
.kpi{display:flex;gap:16px;flex:0 0 auto;height:262px;margin-bottom:26px}
.kpi-l{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow:hidden}
.kpi-l > div{border-radius:8px;padding:10px 20px;display:flex;flex-direction:column;justify-content:center}
.kpi-l span{font-size:26px;font-weight:700;color:var(--sub)}
.kpi-l b{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.kpi .k1{flex:0 0 86px;background:var(--cell);border:1px solid var(--line);flex-direction:row;align-items:center;justify-content:space-between}
.kpi .k1 b{font-size:42px}
.kpi .k2{flex:1;background:var(--navy);color:#fff;justify-content:space-between;padding:14px 26px 24px}
.kpi .k2 span{color:#cfe0f5}
.kpi .k2 b{font-size:74px;line-height:1}
.kpi .k2 small{font-size:36px}
.donut{position:relative;flex:0 0 262px;height:262px}
.donut svg{width:100%;height:100%;display:block}
.donut .dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .dc span{font-size:26px;font-weight:700;color:var(--sub)}
.donut .dc b{font-size:58px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.donut .dc small{font-size:30px}
.sal{flex:1;display:flex;gap:14px;min-height:0}
.sal .col{flex:1;min-width:0}
.sal .r div{white-space:nowrap;overflow:hidden}
.sal.two .r{grid-template-columns:84px 1fr 1.1fr 132px;gap:4px}
.sal.two .r div{padding:0 12px}
.sal.two .r div.sat{color:var(--blue)} .sal.two .r div.sun{color:var(--red)}
.sal.two .r.th div{font-size:24px;letter-spacing:1px}
.unit{flex:0 0 auto;text-align:right;font-size:22px;color:var(--sub);font-weight:700}
.sal .r{display:grid;grid-template-columns:170px 1fr 1fr 200px;gap:6px;margin-bottom:5px}
.sal .r div{display:flex;align-items:center;justify-content:flex-end;padding:0 22px;background:var(--cell);border:1px solid var(--line);border-radius:4px;font-weight:700;font-variant-numeric:tabular-nums}
.sal .r div:first-child{justify-content:center;background:var(--name)}
.sal .r.th div{background:var(--navy);border-color:var(--navy);color:#fff;justify-content:center;font-size:30px;height:58px;letter-spacing:4px}
.sal .r div:first-child small{font-size:.65em;color:var(--sub);margin-left:4px}
.sal .r div.sat small{color:var(--blue)} .sal .r div.sun small{color:var(--red)}
.sal .r div:last-child{justify-content:center}
.sal .r.today div{border:2px solid var(--navy2)}
.empty{flex:1;display:grid;place-items:center;color:#98a2ae;font-size:40px;font-weight:700}

/* 来客予定表 */
.vis{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.room{flex:0 0 auto;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.room h3{margin:0;background:var(--navy2);color:#fff;font-size:36px;padding:8px 20px;letter-spacing:3px;flex:0 0 auto}
.room.small{border-color:#d5dce4}
.room.small h3{background:#eef1f5;color:#7a8592;font-size:28px;padding:8px 20px;display:flex;justify-content:space-between}
.room.small h3 span{font-size:24px;letter-spacing:1px}
.room .list{display:flex;flex-direction:column;padding:8px 10px;gap:6px}
.room .v{display:grid;grid-template-columns:4.6em 1fr 300px;gap:8px}
.novis{flex:1;display:grid;place-items:center;font-size:84px;font-weight:800;color:#98a2ae;letter-spacing:8px;border:4px dashed var(--line);border-radius:14px}
.room .v div{display:flex;align-items:center;background:var(--cell);border:1px solid var(--line);border-radius:4px;padding:0 16px;font-weight:700}
.room .v .t{justify-content:center;font-variant-numeric:tabular-nums}
.room .v .h{background:#fff4d6;border-color:#e6cf8f}
.room .none{color:#98a2ae;font-size:34px;font-weight:700;padding:14px 12px}

/* フッター */
#foot{position:absolute;left:0;right:0;bottom:0;height:68px;display:flex;align-items:center;gap:14px;padding:0 30px;border-top:1px solid var(--line);background:#f6f8fa}
#dots{display:flex;gap:10px;flex:1}
#dots button{font-size:26px;color:var(--sub);font-weight:700;padding:6px 22px;border-radius:24px;border:1px solid var(--line);background:#fff;min-height:50px}
#dots button.on{background:var(--navy);border-color:var(--navy);color:#fff}
#clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--sub)}
#toEdit{font-size:22px;padding:6px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--sub)}

/* ===== 入力モード ===== */
#editor{display:none;background:#eef1f5;min-height:100%;font-size:17px}
body.editing{background:#eef1f5}
body.editing #editor{display:block}
.etop{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.etop h1{font-size:19px;margin:0 10px 0 0}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tabs button{border:none;border-radius:8px;padding:10px 16px;background:#3a6ea3;color:#fff;font-weight:700}
.tabs button.on{background:#fff;color:var(--navy)}
#toShow{border:none;border-radius:8px;padding:10px 18px;background:#f0b429;color:#222;font-weight:800}
.panel{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card h2{font-size:18px;margin:0 0 10px;color:var(--navy)}
.ed input[type=text],.ed input[type=number],.ed input[type=date],.ed input[type=month],.ed textarea,.ed select{font:inherit;font-size:17px;padding:9px 10px;border:1px solid #b7c2cf;border-radius:8px;background:#fff;min-height:44px}
.ed textarea{width:100%;min-height:150px}
.ed button.b{min-height:44px;padding:8px 14px;border:1px solid #b7c2cf;border-radius:8px;background:#f6f8fa;font-weight:700}
.ed button.p{background:var(--navy);color:#fff;border-color:var(--navy)}
.ed button.del{color:var(--red)}
.daybar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daybar .lbl{font-weight:800;font-size:19px;margin-left:6px}
.erow{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:10px 0;border-top:1px solid #e3e8ee;align-items:start}
.erow .en{font-weight:800;font-size:19px;padding-top:10px}
.erow .l{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.erow .i-dest{flex:1 1 220px}
.erow .i-back{width:110px}
.hint{color:#8a5a00;background:#fff4d6;border-radius:6px;padding:4px 8px;font-size:15px}
.grpttl{font-weight:800;color:var(--navy);margin:12px 0 0;padding:6px 10px;background:var(--label);border-radius:6px}
.vrow{display:grid;grid-template-columns:110px 1fr 190px auto;gap:6px;margin-bottom:6px}
.vrow input{width:100%}
.srow{display:grid;grid-template-columns:90px 1fr 1fr 90px auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid #e3e8ee}
.srow span{text-align:right;font-variant-numeric:tabular-nums}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--sub);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0}
.opt label{display:flex;align-items:center;gap:6px;min-height:40px}
.opt input{width:22px;height:22px}
.note-s{color:var(--sub);font-size:14px;margin:6px 0 0}
.ubtn{min-width:150px}
.ubtn.set{background:#fff4d6;border-color:#e6cf8f}
.upanel{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;padding:8px;background:#f3f6f9;border-radius:8px}
.upanel .b{min-width:96px}
.upanel .b.off{color:var(--red);background:#fbeeee}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#sugg{position:absolute;z-index:20;display:none;flex-wrap:wrap;gap:6px;max-width:min(640px,94vw);background:#fff;border:1px solid #b7c2cf;border-radius:10px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#sugg.on{display:flex}
#sugg button{font:inherit;font-size:16px;min-height:42px;padding:6px 12px;border:1px solid #c9d3de;border-radius:8px;background:#f6f8fa;font-weight:700}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
#toast.on{opacity:.92}
@media (max-width:700px){.grid2{grid-template-columns:1fr}.vrow{grid-template-columns:90px 1fr}.srow{grid-template-columns:60px 1fr 1fr}}
</style>
</head>
<body>

<div id="stage">
  <div id="board">
    <section class="screen" id="sc-schedule"></section>
    <section class="screen" id="sc-sales"></section>
    <section class="screen" id="sc-visitors"></section>
    <div id="foot"><div id="dots"></div><div id="clock"></div><button id="toEdit">入力</button></div>
  </div>
</div>

<div id="editor" class="ed">
  <div class="etop">
    <h1>社内掲示ボード 入力</h1>
    <div class="tabs" id="tabs">
      <button data-tab="schedule">行動予定</button>
      <button data-tab="visitors">来客予定</button>
      <button data-tab="sales">売上推移</button>
      <button data-tab="settings">設定</button>
    </div>
    <button id="toShow">▶ 表示に戻る</button>
  </div>
  <div class="panel" id="panel"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
const KEY = 'kz-board-v1';
const DOW = '日月火水木金土';
const SCREENS = {schedule:'行動予定', sales:'売上推移', visitors:'来客予定'};
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d || 1); };
const md = s => { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate(); };
const today = () => ymd(new Date());
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => (v === '' || v == null || isNaN(v)) ? null : Number(v);
const man = v => num(v) == null ? '－' : num(v).toLocaleString('ja-JP') + ' 万円';
const val = v => num(v) == null ? '－' : num(v).toLocaleString('ja-JP');
const $ = s => document.querySelector(s);

/* ---------- 営業日（土日・祝日・会社の休業日を除く） ---------- */
const holidayCache = {};
function jpHolidays(y) {
  if (holidayCache[y]) return holidayCache[y];
  const set = new Set(), add = (m, d) => set.add(ymd(new Date(y, m - 1, d)));
  const nthMon = (m, n) => 1 + ((8 - new Date(y, m - 1, 1).getDay()) % 7) + (n - 1) * 7;
  [[1, 1], [2, 11], [2, 23], [4, 29], [5, 3], [5, 4], [5, 5], [8, 11], [11, 3], [11, 23]].forEach(([m, d]) => add(m, d));
  add(1, nthMon(1, 2)); add(7, nthMon(7, 3)); add(9, nthMon(9, 3)); add(10, nthMon(10, 2));
  const b = y - 1980;
  add(3, Math.floor(20.8431 + 0.242194 * b - Math.floor(b / 4)));   // 春分の日
  add(9, Math.floor(23.2488 + 0.242194 * b - Math.floor(b / 4)));   // 秋分の日
  // 国民の休日（祝日に挟まれた日）
  for (const k of [...set]) {
    const d = parse(k); d.setDate(d.getDate() + 2);
    if (set.has(ymd(d))) { d.setDate(d.getDate() - 1); if (d.getDay() !== 0) set.add(ymd(d)); }
  }
  // 振替休日（日曜日の祝日の次の、祝日でない日）
  for (const k of [...set].sort()) {
    const d = parse(k);
    if (d.getDay() === 0) { do d.setDate(d.getDate() + 1); while (set.has(ymd(d))); set.add(ymd(d)); }
  }
  return holidayCache[y] = set;
}
function companyOff() {
  const s = new Set();
  for (const l of S.offdays || []) { const m = l.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); if (m) s.add(m[1] + '-' + pad(m[2]) + '-' + pad(m[3])); }
  return s;
}
function isBiz(k) {
  const d = parse(k), w = d.getDay();
  return w !== 0 && w !== 6 && !jpHolidays(d.getFullYear()).has(k) && !companyOff().has(k);
}
function nextBiz(k) {
  const d = parse(k);
  for (let i = 0; i < 60; i++) { d.setDate(d.getDate() + 1); if (isBiz(ymd(d))) break; }
  return ymd(d);
}
function hasPlan(k) {
  return Object.values(S.schedule[k] || {}).some(e => e.dest || e.back) || (S.visitors[k] || []).some(v => v.co || v.host);
}
/* 翌営業日の行動予定・来客予定が入力されたら、行動予定表と来客予定表はその日を表示する */
function dispDay() {
  const t = today(), n = nextBiz(t);
  return hasPlan(n) ? n : t;
}
/* 売上推移表：今月の入力がまだ無いうちは、前月（前営業日まで）を表示し続ける */
function salesMonth() {
  const ym = today().slice(0, 7), has = k => Object.keys((S.sales[k] || {}).days || {}).length > 0;
  if (has(ym)) return ym;
  const d = parse(today()); d.setDate(0);
  const prev = ymd(d).slice(0, 7);
  return has(prev) ? prev : ym;
}

/* ---------- データ ---------- */
function defaults() {
  return {
    settings: {rotate: 0, interval: 20, mode: 'auto', screens: {schedule: true, sales: true, visitors: true}},
    staffMain: [], staffTokyo: [], staffInner: [], hosts: [], rooms: [],
    words: {dest: [], co: [], host: []},
    quick: ['休み', '内勤', '県内'], offdays: [],
    schedule: {}, notes: {}, visitors: {}, sales: {}
  };
}
let S;
function load() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (raw) {
    try {
      S = Object.assign(defaults(), JSON.parse(raw));
      S.settings = Object.assign(defaults().settings, S.settings);
      S.words = Object.assign(defaults().words, S.words);
      return;
    } catch (e) {}
  }
  S = defaults();
  if (DEMO) seedDemo();
  save();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('保存できませんでした（ブラウザの保存領域を確認してください）'); }
}
function prune() {
  const lim = new Date(); lim.setDate(lim.getDate() - 90);
  const k = ymd(lim);
  for (const t of ['schedule', 'notes', 'visitors']) for (const d in S[t]) if (d < k) delete S[t][d];
  S.offdays = (S.offdays || []).filter(d => d >= k);
}
const DEMO = false; function seedDemo() {}

/* 行動予定：当日の入力が無ければ、期限（～日付）付きの直近の入力を引き継ぐ */
function entryFor(name, day) {
  const own = (S.schedule[day] || {})[name];
  if (own && (own.dest || own.back)) return Object.assign({from: day}, own);
  const d = parse(day);
  for (let i = 1; i <= 31; i++) {
    d.setDate(d.getDate() - 1);
    const k = ymd(d), e = (S.schedule[k] || {})[name];
    if (e && e.dest) return (e.until && e.until >= day) ? {dest: e.dest, until: e.until, back: '', from: k, carried: true} : null;
  }
  return null;
}

/* ---------- 表示モード ---------- */
function header(title, k, badge) {
  const d = k ? parse(k) : new Date(), w = d.getDay();
  // 日付を指定して札を付けたとき（＝翌営業日の表示）は、見出しを黄色にして今日と区別する
  return `<div class="hd${badge && k ? ' next' : ''}"><div class="date">${d.getMonth() + 1}<small>月</small>${d.getDate()}<small>日</small></div>
    <div class="title${badge ? ' wb' : ''}">${title}${badge ? `<span class="badge">${badge}</span>` : ''}</div>
    <div class="dow"><b class="${w === 6 ? 'sat' : w === 0 ? 'sun' : ''}">${DOW[w]}</b>曜日</div></div>`;
}
function renderSchedule() {
  const t = dispDay();
  const rowsMain = S.staffMain.length, rowsTokyo = S.staffTokyo.length;
  // 内勤メンバーは、その日に行動を書いた人がいるときだけ枠を出す
  const inner = S.staffInner.filter(nm => { const e = entryFor(nm, t); return e && (e.dest || e.back); });
  const n = rowsMain + (rowsTokyo ? rowsTokyo + 1 : 0) + (inner.length ? inner.length + 1 : 0);
  const avail = 1440 - 68 - 26 - 10 - 150 - 62 - 110;
  const rowH = (avail - 6 * n) / Math.max(n, 1);
  const fs = Math.max(22, Math.min(46, rowH * 0.56));
  const row = name => {
    const e = entryFor(name, t);
    let ds = '';
    if (e && e.dest) {
      ds = `<span class="${/休/.test(e.dest) ? 'red' : ''}">${esc(e.dest)}</span>`;
      if (e.until && e.until > t) ds += `<span class="until">～${md(e.until)}</span>`;
    }
    return `<div class="r"><div class="c nm fit">${esc(name)}</div><div class="c ds fit">${ds}</div><div class="c bk fit">${e && e.back ? esc(e.back) : '－'}</div></div>`;
  };
  let h = header('行動予定表', t, t !== today() ? '翌営業日の予定' : '') + `<div class="sch" style="font-size:${fs}px">
    <div class="r th"><div>氏名</div><div>行先</div><div style="letter-spacing:2px">帰社時間</div></div>`;
  h += S.staffMain.map(row).join('');
  if (rowsTokyo) {
    h += `<div class="sep"></div><div class="r grp"><div class="c nm fit">東京営業所</div><div class="c ds"></div><div class="c bk"></div></div>`;
    h += S.staffTokyo.map(row).join('');
  }
  if (inner.length) {
    h += `<div class="sep"></div><div class="r grp"><div class="c nm fit">内勤</div><div class="c ds"></div><div class="c bk"></div></div>`;
    h += inner.map(row).join('');
  }
  if (!n) h += `<div class="empty">「入力」→「設定」で名簿を入れてください</div>`;
  h += `<div class="note"><div class="c nm">備考欄</div><div class="c ds">${esc(S.notes[t] || '')}</div></div></div>`;
  $('#sc-schedule').innerHTML = h;
}
function renderSales() {
  const ym = salesMonth(), m = S.sales[ym] || {days: {}};
  const target = num(m.target);
  const keys = Object.keys(m.days).map(Number).sort((a, b) => a - b);
  const rate = c => (target && num(c) != null) ? (num(c) / target * 100).toFixed(1) + ' %' : '－';
  const last = keys.length ? m.days[keys[keys.length - 1]] : null;
  const hasRate = !!(target && last && num(last.c) != null);
  const pct = hasRate ? num(last.c) / target * 100 : 0;
  // 遂行率のドーナツ（100%を超えたら輪は満タンのまま、数字は実際の値）
  const R = 100, C = 2 * Math.PI * R, len = Math.min(100, pct) / 100 * C;
  const donut = `<svg viewBox="0 0 240 240" aria-hidden="true">
      <circle cx="120" cy="120" r="${R}" fill="none" stroke="#dfe5ec" stroke-width="30"/>
      ${len > 0 ? `<circle cx="120" cy="120" r="${R}" fill="none" stroke="${pct >= 100 ? '#1f7a3a' : 'var(--navy2)'}" stroke-width="30" stroke-linecap="round"
        stroke-dasharray="${len} ${C}" transform="rotate(-90 120 120)"/>` : ''}</svg>`;
  let h = header('売上推移表', null, Number(ym.slice(5)) + '月分') + `<div class="kpi">
    <div class="kpi-l">
      <div class="k1"><span>今月の目標</span><b>${man(m.target)}</b></div>
      <div class="k2"><span>当月累計売上</span><b>${last && num(last.c) != null ? val(last.c) + '<small> 万円</small>' : '－'}</b></div>
    </div>
    <div class="donut">${donut}<div class="dc"><span>遂行率</span><b>${hasRate ? pct.toFixed(1) + '<small>%</small>' : '－'}</b></div></div></div>`;
  if (!keys.length) {
    h += `<div class="empty">まだ入力がありません</div>`;
  } else {
    // 16行を超えたら左右2列に分けて、31日まで大きな文字のまま収める
    const two = keys.length > 16, half = Math.ceil(keys.length / 2);
    const cols = two ? [keys.slice(0, half), keys.slice(half)] : [keys];
    const avail = 827 - (two ? 32 : 0);   // 表の行に使える高さ（見出し・合計欄・単位の行を除く）
    const rowH = Math.min(62, avail / cols[0].length - 5);
    const fs = Math.max(20, Math.min(two ? 30 : 36, rowH * 0.6));
    const [y, mo] = ym.split('-').map(Number);
    h += `<div class="sal${two ? ' two' : ''}">`;
    for (const col of cols) {
      h += `<div class="col"><div class="r th"><div>日</div><div>当月受注</div><div>${two ? '累計売上' : '当月累計売上'}</div><div>遂行率</div></div>`;
      for (const k of col) {
        const w = new Date(y, mo - 1, k).getDay(), e = m.days[k];
        // 2列のときは曜日を省き、土日は日付の色で見分ける
        h += `<div class="r${k === keys[keys.length - 1] ? ' today' : ''}" style="height:${rowH}px;font-size:${fs}px">
          <div class="${w === 6 ? 'sat' : w === 0 ? 'sun' : ''}">${k}日${two ? '' : `<small>(${DOW[w]})</small>`}</div>
          <div>${two ? val(e.o) : man(e.o)}</div><div>${two ? val(e.c) : man(e.c)}</div><div>${two ? rate(e.c).replace(' ', '') : rate(e.c)}</div></div>`;
      }
      h += `</div>`;
    }
    h += `</div>`;
    if (two) h += `<div class="unit">（単位：万円）</div>`;
  }
  $('#sc-sales').innerHTML = h;
}
function renderVisitors() {
  const t = dispDay(), list = (S.visitors[t] || []).slice().sort((a, b) => (a.t || '99').localeCompare(b.t || '99'));
  let h = header('来客予定表', t, t !== today() ? '翌営業日の予定' : '') + `<div class="vis">`;
  const per = S.rooms.map((r, i) => list.filter(v => v.room === i && (v.co || v.host || v.t)));
  const total = per.reduce((a, l) => a + l.length, 0);
  if (!S.rooms.length) h += `<div class="empty">「入力」→「設定」で部屋を入れてください</div>`;
  else if (!total) h += `<div class="novis">来客予定なし</div>`;
  else {
    // 予定のない部屋は1行に小さくまとめ、空いた高さを予定のある部屋の文字に回す
    const full = per.filter(l => l.length).length, empty = S.rooms.length - full;
    const avail = 1170 - empty * 74 - full * 100;
    const rowH = Math.max(52, Math.min(150, avail / total - 6));
    const fs = Math.max(26, Math.min(58, rowH * 0.42));
    S.rooms.forEach((r, i) => {
      const vs = per[i];
      if (!vs.length) { h += `<div class="room small"><h3>${esc(r)}<span>予定なし</span></h3></div>`; return; }
      h += `<div class="room"><h3>${esc(r)}</h3><div class="list">` +
        vs.map(v => `<div class="v" style="height:${rowH}px;font-size:${fs}px"><div class="t">${esc(v.t || '')}</div><div class="fit">${esc(v.co || '')}</div><div class="h fit">${esc(v.host || '')}</div></div>`).join('') +
        `</div></div>`;
    });
  }
  $('#sc-visitors').innerHTML = h + `</div>`;
}
/* はみ出す文字は自動で縮小する */
function shrink(root) {
  root.querySelectorAll('.fit').forEach(el => {
    el.style.fontSize = '';
    let fs = parseFloat(getComputedStyle(el).fontSize), n = 0;
    while (el.scrollWidth > el.clientWidth + 1 && fs > 14 && n++ < 40) { fs -= 2; el.style.fontSize = fs + 'px'; }
  });
}

let cur = 0, shownAt = 0, forced = null, manual = null;
function cycleList() {
  if (forced) return [forced];
  const st = S.settings;
  if (st.mode !== 'auto') return [st.mode];
  const l = Object.keys(SCREENS).filter(k => st.screens[k]);
  return l.length ? l : ['schedule'];
}
function showScreen() {
  const l = cycleList();
  if (cur >= l.length) cur = 0;
  const id = manual || l[cur];
  ({schedule: renderSchedule, sales: renderSales, visitors: renderVisitors})[id]();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 'sc-' + id));
  shrink($('#sc-' + id));
  $('#dots').innerHTML = tabList().map(k => `<button data-scr="${k}" class="${k === id ? 'on' : ''}">${SCREENS[k]}</button>`).join('');
  shownAt = Date.now();
}
/* 下のタブ：自動切り替えなら切り替え対象の画面、固定表示なら3画面すべて */
function tabList() {
  const st = S.settings;
  const l = Object.keys(SCREENS).filter(k => st.mode !== 'auto' || st.screens[k]);
  return l.length > 1 ? l : [];
}
$('#dots').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const l = cycleList(), i = l.indexOf(b.dataset.scr);
  if (i >= 0) { cur = i; manual = null; }   // 自動切り替えの順番はここから続ける
  else manual = b.dataset.scr;              // 固定表示中は、しばらく見せてから元の画面に戻す
  showScreen();
});
function fit() {
  const r = Number(S.settings.rotate) || 0, side = r !== 0;
  const W = side ? innerHeight : innerWidth, H = side ? innerWidth : innerHeight;
  const s = Math.min(W / 1080, H / 1440);
  $('#board').style.transform = `translate(-50%,-50%) rotate(${r}deg) scale(${s})`;
}
function tick() {
  const d = new Date();
  $('#clock').textContent = d.getHours() + ':' + pad(d.getMinutes());
  if (document.body.classList.contains('editing')) return;
  const l = cycleList(), sec = Math.max(5, Number(S.settings.interval) || 20);
  if (manual) { if (Date.now() - shownAt >= Math.max(60, sec) * 1000) { manual = null; showScreen(); } }
  else if (l.length > 1 && Date.now() - shownAt >= sec * 1000) { cur = (cur + 1) % l.length; showScreen(); }
  else if (Date.now() - shownAt >= 60000) showScreen();   // 固定表示でも1分ごとに日付・内容を更新
}
let wake = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (e) {}
}
function startDisplay() {
  document.body.classList.remove('editing');
  cur = 0; fit(); showScreen(); keepAwake();
}

  const v = {dest: row.querySelector('.i-dest').value.trim(), until: row.querySelector('.i-until').value, back: row.querySelector('.i-back').value.trim()};
  S.schedule[edDay] = S.schedule[edDay] || {};
  if (!v.dest && !v.until && !v.back) delete S.schedule[edDay][name]; else S.schedule[edDay][name] = v;
  save();
}
$('#panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) {
    const sr = e.target.closest('.srow');
    if (sr) { const m = S.sales[edMonth], d = m.days[sr.dataset.k]; $('#s-day').value = sr.dataset.k; $('#s-o').value = d.o ?? ''; $('#s-c').value = d.c ?? ''; scrollTo(0, 0); }
    return;
  }
  const row = b.closest('.erow');
  if (b.dataset.dshift) { const d = parse(edDay); d.setDate(d.getDate() + Number(b.dataset.dshift)); edDay = ymd(d); renderEditor(); }
  else if ('dtoday' in b.dataset) { edDay = today(); renderEditor(); }
  else if ('dnext' in b.dataset) { edDay = nextBiz(today()); renderEditor(); }
  else if (row && 'q' in b.dataset) { row.querySelector('.i-dest').value = b.dataset.q; saveRow(row); renderEditor(); toast('保存しました'); }
  else if (row && 'clear' in b.dataset) { row.querySelectorAll('input').forEach(i => i.value = ''); saveRow(row); renderEditor(); toast('消しました'); }
  else if (row && b.dataset.back) { row.querySelector('.i-back').value = b.dataset.back; saveRow(row); toast('保存しました'); }
  else if (row && 'upick' in b.dataset) { untilPanel(row); }
  else if (row && 'uset' in b.dataset) { row.querySelector('.i-until').value = b.dataset.uset; saveRow(row); renderEditor(); toast('保存しました'); }
  else if (b.id === 'off-add') {
    let a = $('#off-a').value, z = $('#off-b').value || a;
    if (!a) { toast('休みの日を選んでください'); return; }
    if (z < a) [a, z] = [z, a];
    const set = new Set(S.offdays), d = parse(a);
    for (let i = 0; i < 60 && ymd(d) <= z; i++) { set.add(ymd(d)); d.setDate(d.getDate() + 1); }
    S.offdays = [...set].sort(); save(); renderEditor(); toast('休業日を追加しました');
  }
  else if (b.dataset.offdel) { S.offdays = S.offdays.filter(k => k !== b.dataset.offdel); save(); renderEditor(); toast('取り消しました'); }
  else if (b.dataset.vadd) { (S.visitors[edDay] = S.visitors[edDay] || []).push({room: Number(b.dataset.vadd), t: '', co: '', host: ''}); save(); renderEditor(); }
  else if (b.dataset.vdel) { S.visitors[edDay].splice(Number(b.dataset.vdel), 1); save(); renderEditor(); toast('削除しました'); }
  else if (b.id === 's-add') {
    const k = $('#s-day').value, o = $('#s-o').value, c = $('#s-c').value;
    if (o === '' && c === '') { toast('数字を入力してください'); return; }
    const m = S.sales[edMonth] = S.sales[edMonth] || {target: '', days: {}};
    m.days[k] = {o: num(o), c: num(c)}; save(); renderEditor(); toast(k + '日を登録しました');
  }
  else if (b.dataset.sdel) { if (confirm(b.dataset.sdel + '日の数字を削除しますか？')) { delete S.sales[edMonth].days[b.dataset.sdel]; save(); renderEditor(); } }
  else if (b.id === 'o-export') {
    const blob = new Blob([JSON.stringify(S)], {type: 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'board-backup-' + today().replace(/-/g, '') + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }
  else if (b.id === 'o-wipe') { if (confirm('行動予定・来客予定・売上の入力をすべて消します。よろしいですか？')) { S.schedule = {}; S.notes = {}; S.visitors = {}; S.sales = {}; save(); toast('消しました'); } }
});
$('#panel').addEventListener('input', e => {
  const el = e.target, row = el.closest('.erow');
  if (catOf(el)) showSugg(el);
  if (row) { saveRow(row); return; }
  if (el.id === 'i-note') { S.notes[edDay] = el.value; save(); return; }
  const vr = el.closest('.vrow');
  if (vr) { const v = S.visitors[edDay][vr.dataset.i]; v.t = vr.querySelector('.v-t').value; v.co = vr.querySelector('.v-co').value; v.host = vr.querySelector('.v-host').value; save(); return; }
  if (el.id === 's-target') { const m = S.sales[edMonth] = S.sales[edMonth] || {target: '', days: {}}; m.target = num(el.value); save(); return; }
  if (el.id === 'o-int') { S.settings.interval = Math.max(5, Number(el.value) || 20); save(); return; }
  const lines = v => v.split('\n').map(s => s.trim()).filter(Boolean);
  const map = {'o-main': 'staffMain', 'o-tokyo': 'staffTokyo', 'o-inner': 'staffInner', 'o-hosts': 'hosts', 'o-rooms': 'rooms', 'o-quick': 'quick'};
  if (map[el.id]) { S[map[el.id]] = lines(el.value); save(); }
  else if (el.id === 'o-wdest') { S.words.dest = lines(el.value); save(); }
  else if (el.id === 'o-wco') { S.words.co = lines(el.value); save(); }
});
$('#panel').addEventListener('change', e => {
  const el = e.target;
  if (catOf(el)) { addWord(catOf(el), el.value); return; }   // 入力し終えた言葉を候補に登録
  if (el.id === 'edDay' && el.value) { edDay = el.value; renderEditor(); }
  else if (el.id === 'edMonth' && el.value) { edMonth = el.value; renderEditor(); }
  else if (el.name === 'mode') { S.settings.mode = el.value; save(); }
  else if (el.name === 'rot') { S.settings.rotate = Number(el.value); save(); }
  else if (el.dataset.scr) { S.settings.screens[el.dataset.scr] = el.checked; save(); }
  else if (el.id === 'o-import' && el.files[0]) {
    el.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!d.settings || !d.schedule) throw new Error();
      if (confirm('今のデータを、読み込んだデータに置き換えます。よろしいですか？')) { S = Object.assign(defaults(), d); save(); renderEditor(); toast('読み込みました'); }
    }).catch(() => toast('読み込めませんでした（ファイルを確認してください）'));
  }
});

/* 「～いつまで」は日付ボタンから選ぶ（iPadの日付入力は開いた瞬間に今日が入ってしまうため使わない） */
function untilPanel(row) {
  const old = row.querySelector('.upanel');
  if (old) { old.remove(); return; }
  const d = parse(edDay);
  let h = '<div class="upanel"><button class="b" data-uset="">日付なし</button>';
  for (let i = 0; i < 21; i++) {
    d.setDate(d.getDate() + 1);
    const k = ymd(d), w = d.getDay();
    h += `<button class="b${!isBiz(k) ? ' off' : ''}" data-uset="${k}">${d.getMonth() + 1}/${d.getDate()}(${DOW[w]})</button>`;
  }
  row.querySelector('.i-until').parentNode.insertAdjacentHTML('afterend', h + '</div>');
}

/* 入力候補（一度入力した言葉を覚えて、入力欄を押したときに出す） */
function catOf(el) {
  const c = el.classList;
  return !c ? null : c.contains('i-dest') ? 'dest' : c.contains('v-co') ? 'co' : c.contains('v-host') ? 'host' : null;
}
function addWord(cat, w) {
  w = (w || '').trim();
  if (!w || S.quick.includes(w)) return;
  const l = S.words[cat] = (S.words[cat] || []).filter(x => x !== w);
  l.unshift(w); if (l.length > 300) l.length = 300;
  save();
}
function candidates(cat) {
  if (cat === 'host') return [...new Set([...S.hosts, ...S.words.host, ...S.staffMain, ...S.staffTokyo, ...S.staffInner])];
  return S.words[cat] || [];
}
const sugg = document.createElement('div');
sugg.id = 'sugg'; document.body.appendChild(sugg);
let suggFor = null;
function hideSugg() { sugg.classList.remove('on'); suggFor = null; }
function showSugg(el) {
  const cat = catOf(el); if (!cat) return hideSugg();
  const q = el.value.trim();
  const list = candidates(cat).filter(w => w !== q && (!q || w.includes(q))).slice(0, 12);
  if (!list.length) return hideSugg();
  suggFor = el;
  sugg.innerHTML = list.map(w => `<button type="button" data-w="${esc(w)}">${esc(w)}</button>`).join('');
  const r = el.getBoundingClientRect();
  sugg.style.left = (r.left + scrollX) + 'px';
  sugg.style.top = (r.bottom + scrollY + 4) + 'px';
  sugg.classList.add('on');
}
sugg.addEventListener('pointerdown', e => e.preventDefault());   // 候補を押しても入力欄から外れないようにする
sugg.addEventListener('mousedown', e => e.preventDefault());
sugg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || !suggFor) return;
  const el = suggFor;
  el.value = b.dataset.w;
  el.dispatchEvent(new Event('input', {bubbles: true}));
  addWord(catOf(el), el.value);
  hideSugg(); el.blur(); toast('保存しました');
});
$('#panel').addEventListener('focusin', e => showSugg(e.target));
$('#panel').addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || !catOf(document.activeElement)) hideSugg(); }, 200));

/* ---------- 起動 ---------- */
load(); prune(); save();
const hash = location.hash.slice(1);
if (SCREENS[hash]) forced = hash;
addEventListener('resize', fit);
document.addEventListener('visibilitychange', () => { keepAwake(); if (!document.body.classList.contains('editing')) showScreen(); });
if (hash === 'edit') startEdit();
else if (!S.staffMain.length && !S.staffTokyo.length) { tab = 'settings'; startEdit(); }   // 初回は設定画面から
else startDisplay();
/* 一度開けば、以後はネットにつながっていなくても動くようにする */
if (location.protocol === 'https:' && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
tick(); setInterval(tick, 1000);
</script>
